site_name: Chaithanya Shyam
site_url: https://www.chaithu.in/
site_author: Chaithanya Shyam Delanthabettu
site_description: >-
  Chaithanya Shyam Delanthabettu — CS grad student at Georgia Tech,
  ex-Google software engineer, competitive programmer. Distributed
  systems and blockchain.

repo_url: https://github.com/Dragonado/website
repo_name: Dragonado/website
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  font:
    text: Source Sans 3
    code: Inconsolata
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - About: about.md
  - Projects:
      - projects/index.md
      - Buzzcoin: https://github.com/Dragonado/carnival-deal
      - Corrent: https://github.com/Dragonado/corrent
      - CodePal: https://github.com/Dragonado/CodePal
      - CP problem sets: https://github.com/Dragonado/my_CP_problems
  - Blog:
      - blog/index.md
  - CV: https://www.chaithu.in/assets/cv.pdf

hooks:
  - hooks/blog_nav.py

plugins:
  - search
  - blog:
      blog_dir: blog
      post_url_format: "{date}/{slug}"
      post_excerpt: optional
      archive: false
      categories: false

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Dragonado
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/chaithanya-shyam/
      name: LinkedIn
    - icon: fontawesome/solid/paper-plane
      link: mailto:codecraft15@gmail.com
      name: Email

copyright: >
  Copyright &copy; 2026 Chaithanya Shyam Delanthabettu ·
  Design adapted from <a href="https://github.com/algorithmica-org/algorithmica">Algorithmica</a>
  by Sergey Slotin under the MIT License

extra_css:
  - stylesheets/algorithmica.css

extra_javascript:
  - javascripts/algorithmica.js
